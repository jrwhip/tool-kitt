[project]
name = "wopr"
dynamic = ["version"]
description = "WOPR: a right-sized agent harness for Claude Code (MCP tools, skills, agents, commands)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Jerry" }
]
keywords = ["mcp", "claude", "ai", "cli", "wopr"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    # mcp 2.0.0 removed mcp.server.fastmcp (server.py imports it); pin below 2 until migrated.
    "mcp[cli]>=1.0.0,<2",
    "pyyaml>=6.0",
]

[project.scripts]
wopr = "wopr.cli:main"
# Same entry point the generated plugin bundle declares, so the launch
# contract in the emitted `.mcp.json` is exercised from a dev checkout
# too. `wopr` with no subcommand does the same thing.
wopr-serve = "wopr.cli:serve"

# [project.urls] is deliberately absent until this repo has a public
# home. The prior toolset's URLs pointed at a private client org and do
# not cross over.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/wopr/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/wopr"]

[tool.hatch.build.targets.wheel.hooks.custom]
# Auto-enumerates every catalog/<pack>/ dir at build time and adds
# each as a force-include entry (catalog/<pack> → wopr/resources/<pack>),
# plus the standalone catalog.yaml manifest. Lives in ``hatch_build.py``
# at the project root; hatchling auto-discovers it. Replaces the prior
# per-pack list that required a manual pyproject.toml edit on every
# new pack.
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
    "src/",
    "catalog/",
    "catalog.yaml",
    "README.md",
    "LICENSE",
]

[project.optional-dependencies]
# Optional semantic-search layer for CRAG. Adds ~100MB
# install delta via fastembed + onnxruntime + the ONNX-exported
# BAAI/bge-small-en-v1.5 model (~130MB downloaded to ~/.cache/fastembed
# on first encode). Without this extra, learnings_search falls back
# to the deterministic prefilter; the crew still works.
embeddings = [
    "fastembed>=0.7",
    "numpy>=1.24",
]
# Optional Amazon Bedrock embedding provider (Titan Text Embeddings V2).
# Soft-imported; selecting `provider: bedrock` without boto3 or AWS
# credentials degrades to the deterministic prefilter, never crashes.
# Requires the `embeddings` extra too (numpy is the vector substrate).
bedrock = [
    "boto3>=1.34",
]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-PyYAML>=6.0",
]

[tool.ruff]
extend-exclude = ["plugins"]  # generated by build-plugins; lint the catalog instead
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Test files routinely use private symbols of the modules under test
# (the ``_foo`` prefix is a documentation convention, not a Python
# access control); silencing ``RUF012`` for tests would mask real
# issues in production code, so the override is per-file rather than
# global. Add entries here when a real exemption arises; an empty
# table is fine until then.

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_any_generics = true

# Optional deps from the `embeddings`/`bedrock` extras; not installed in
# the base dev env, and _embeddings.py / _embedding_providers.py already
# guard the imports at runtime.
[[tool.mypy.overrides]]
module = ["numpy", "fastembed", "boto3"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: tests that download models or are otherwise slow; opt in with `-m slow`",
]

[tool.coverage.run]
source = ["src/wopr"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]
# No fail_under threshold yet; add one once the existing test suite is
# brought up to coverage parity on the newer modules. ``pytest-cov``
# still emits per-run reports under ``--cov``.
