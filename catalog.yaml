packs:
  _core:
    description: "Foundation tools: mental models, debugging, todo management, planning"
    always_installed: true

  crew:
    description: "Universal four-role agent crew (scout, coder, tester, auditor): one REQ per run, API-contract-first (OpenAPI or GraphQL), spec-files-as-authority, coverage-gated. For any disciplined dev project (net-new, ongoing iteration, blocker fix, or frontend handoff)."
    tags: [crew, workflow, audit]

  angular:
    description: "Angular development: component patterns, testing, code review"
    tags: [frontend, typescript, angular]

  python:
    description: "Python development: FastAPI, AI integrations (Bedrock, Vertex, Pinecone), testing, packaging"
    tags: [backend, python, ai, fastapi]

  auditors:
    description: "Skill, command, and subagent quality auditors"
    tags: [meta, quality]

  meta-authoring:
    description: "Tools for creating new commands, skills, agents, and hooks, plus capturing hard-won knowledge as reusable skills"
    tags: [meta, authoring]

profiles:
  angular-team:
    description: "Standard setup for Angular teams"
    packs: [crew, angular, auditors]

  python-ai:
    description: "Python AI/ML services with FastAPI, Bedrock, Vertex, and Pinecone"
    packs: [crew, python, auditors]

  fullstack:
    description: "Angular front end + Python/FastAPI backend"
    packs: [crew, angular, python, auditors]

  everything:
    description: "All packs"
    packs: [crew, angular, python, auditors, meta-authoring]
