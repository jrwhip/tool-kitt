# Count native Claude Code skill invocations into WOPR's usage sidecar.
#
# Claude-only on purpose, and this one is not a "not ported yet" gap: the
# handler counts assistant `tool_use` blocks named `Skill` out of Claude
# Code's own transcript JSONL. Copilot's agentStop plus its
# `events.jsonl` would make an equivalent counter buildable, but what a
# native skill invocation looks like in that transcript has not been
# verified against a real session. A telemetry hook that silently counts
# zero is worse than a documented gap, because the resulting report still
# looks authoritative -- which is the exact failure this hook exists to
# fix on Claude. See the `Coverage boundary` section of README.md and
# docs/skill-usage-telemetry.md.
name: skill-usage
description: >-
  Count native Claude Code Skill tool invocations into WOPR's usage
  sidecar (names and counts only).
handler: skill-usage-hook.py
targets:
  claude:
    event: Stop
    # Empty matcher: Stop carries no tool name to match on, but Claude's
    # schema still expects the key, and omitting it leaves re-registration
    # unable to normalize an entry that has one.
    matcher: ""
