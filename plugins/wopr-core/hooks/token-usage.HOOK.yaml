# Attribute per-tool token usage for a Claude Code session into a durable
# sidecar, so cost is measurable instead of estimated after the fact.
#
# Claude-only on purpose, same rule as skill-usage: the handler parses
# Claude Code's transcript JSONL shape (per-turn `usage` objects joined
# to `tool_use`/`tool_result` blocks). A counter that silently records
# zero on another CLI is worse than a documented gap. The companion
# reader `token-usage-report.py` renders the sidecar; it is not a hook.
name: token-usage
description: >-
  Record per-tool token attribution for the session into
  ~/.wopr/token-usage.json on every Stop (names, counts, and token
  figures only; no prompt text, inputs, or file paths).
handler: token-usage-hook.py
targets:
  claude:
    event: Stop
    # Empty matcher: Stop carries no tool name to match on, but Claude's
    # schema still expects the key, and omitting it leaves re-registration
    # unable to normalize an entry that has one.
    matcher: ""
