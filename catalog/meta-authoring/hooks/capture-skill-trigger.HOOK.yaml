# Nudge toward wopr-capture-skill once a session accumulates tool calls.
#
# Claude-only. A Copilot target and a separate `agentStop` handler existed
# here and were removed in P2 along with the rest of WOPR's Copilot
# surface: Copilot's transcript is an events.jsonl of
# `tool.execution_start` records rather than Claude's nested `tool_use`
# blocks, and `agentStop` supports only decision/reason where `Stop`
# supports non-blocking `additionalContext`, so the port was a second
# program rather than a renamed event, and it was never verified against
# a live firing. The quarry keeps both if Copilot support returns.
name: capture-skill-trigger
description: >-
  Nudge the agent to consider running wopr-capture-skill once a session
  crosses a tool-call threshold.
handler: capture-skill-trigger-hook.py
targets:
  claude:
    event: Stop
    # Empty matcher: Stop carries no tool name to match on, but Claude's
    # schema still expects the key, and omitting it leaves re-registration
    # unable to normalize an entry that has one.
    matcher: ""
