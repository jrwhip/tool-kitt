# kitt.yml generated by /kitt-create-yml for mission-log.
# Schema: kitt-yml-schema.md (KITT crew pack; mcp get_pack_template)
# Reviewed by the operator before the first crew run.

project:
  slug: mission-log
  name: Mission Log
  target_source_root: src/app
  test_root: src
  build_file: package.json

specs:
  coder_spec: specs/coder-spec.md
  tester_spec: specs/tester-spec.md
  audit_report: AUDIT_REPORT.md
  spec_writes: false

# The machine-readable API contract agents cite. Frontend-only project: the contract is checked in.
api_contract:
  kind: openapi
  spec_url: api/openapi.json
  pinned_generator_version: openapi-generator-cli 7.21.0

# Which model each crew role runs on, and how that moves with complexity.
# REQ-ML-1 touches four files, so high_at_files: 3 makes it a high-complexity
# run: the coder and auditor move up one tier (sonnet -> opus); the scout stays on haiku.
crew:
  models:
    scout: haiku
    coder: sonnet
    tester: sonnet
    auditor: sonnet
  escalation:
    roles: [coder, auditor]
    high_at_files: 3

requirements:
  source: local
  local:
    path: requirements  # directory of <REQ-ID>.md files, relative to this kitt.yml
  # When source: jira, replace local: above with:
  #   jira:
  #     project_key: <PROJECT-KEY>  # optional sanity check

# legacy-migration block intentionally omitted. Add it by hand when migrating from a legacy stack; see kitt.example.yml.
